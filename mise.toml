[tools]
go = "1.24.0"
golangci-lint = "1.64.6"
actionlint = "1.7.7"

[tasks.install]
description = "Install dependencies"
run = "go mod download"

[tasks."lint:go"]
description = "Lint Go code"
run = "golangci-lint run ./..."

[tasks."lint:actions"]
description = "Lint GitHub Actions"
run = "actionlint"

[tasks.lint]
description = "Run all linters"
depends = ["lint:*"]

[tasks."fmt:go"]
description = "Format Go code"
run = "go fmt ./..."

[tasks.fmt]
description = "Run all formatters"
depends = ["fmt:*"]

[tasks.test]
description = "Run tests"
run = "go test -v ./..."

[tasks.codegen]
description = "Update generated code"
run = "echo 'No codegen tasks defined'"

[tasks.ci]
description = "Run CI pipeline"
depends = ["lint", "test"]
